name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  vet:
    name: Go test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go vet
        run: go vet ./...
  test:
    name: Go test with generated PDFs
    runs-on: ubuntu-latest
    needs: vet

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create Python virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install reportlab

      - name: Generate test PDFs
        run: |
          source venv/bin/activate
          python ./testdata/generate/gen_valid.py
          python ./testdata/generate/gen_invalid.py
          python ./testdata/generate/gen_special.py

      - name: Go test
        run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
